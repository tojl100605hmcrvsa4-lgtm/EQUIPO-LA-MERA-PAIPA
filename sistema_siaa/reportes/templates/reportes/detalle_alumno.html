<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Alumno - Sistema SIAA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f5;
            text-align: center;
            margin: 50px;
        }
        .caja {
            background-color: white;
            width: 400px;
            margin: 0 auto;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        h1 {
            color: #1a365d;
        }
        .boton {
            background-color: #2b6cb0;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="caja">
        <h1>Detalle del Alumno - Sistema SIAA</h1>
        <hr>

        <p><strong>Nombre:</strong> {{ alumno.nombre_completo }}</p>
        <p><strong>Grupo:</strong> {{ alumno.grupo }}</p>
        <p><strong>Matrícula:</strong> {{ alumno.matricula }}</p>

        <hr>

        <a href="{% url 'lista_reportes' %}" class="boton">Regresar a la Tabla Principal</a>
    </div>

</body>
</html>
