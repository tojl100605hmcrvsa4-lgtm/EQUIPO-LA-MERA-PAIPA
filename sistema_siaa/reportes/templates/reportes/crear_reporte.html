<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Reporte - SIAA</title>
</head>
<body>
    <h1>Registrar Nuevo Reporte</h1>
    <form method="POST">
        {% csrf_token %}
        <label>Alumno:</label><br>
        <select name="alumno" required>
            {% for alumno in alumnos %}
                <option value="{{ alumno.id }}">{{ alumno.matricula }} - {{ alumno.nombre_completo }}</option>
            {% endfor %}
        </select><br><br>

        <label>Tipo de reporte:</label><br>
        <select name="tipo" required>
            <option value="INASISTENCIA">Inasistencia</option>
            <option value="ACTITUDINAL">Actitudinal</option>
            <option value="ACADEMICO">Académico</option>
        </select><br><br>

        <label>Descripción:</label><br>
        <textarea name="descripcion" rows="4" cols="40" required></textarea><br><br>

        <label>Registrado por (Docente/Preceptor):</label><br>
        <input type="text" name="registrado_por" required><br><br>

        <button type="submit">Guardar Reporte</button>
        <a href="{% url 'lista_reportes' %}">Cancelar</a>
    </form>
</body>
</html>
