<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Reporte - Sistema SIAA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f5;
            text-align: center;
            margin: 40px;
        }
        .caja {
            background-color: white;
            width: 400px;
            margin: 0 auto;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        h1 {
            color: #1a365d;
        }
        input, select, textarea {
            width: 90%;
            padding: 8px;
            margin: 8px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .boton {
            background-color: #2b6cb0;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
        .boton-gris {
            background-color: #718096;
            color: white;
            padding: 10px 18px;
            border-radius: 5px;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="caja">
        <h1>Nuevo Reporte</h1>

        <form method="POST">
            {% csrf_token %}

            <label><strong>Alumno:</strong></label><br>
            <select name="alumno" required>
                {% for alumno in alumnos %}
                    <option value="{{ alumno.id }}">{{ alumno.nombre_completo }} ({{ alumno.grupo }})</option>
                {% endfor %}
            </select><br>

            <label><strong>Tipo de Reporte:</strong></label><br>
            <select name="tipo" required>
                {% for valor, etiqueta in tipos_reporte %}
                    <option value="{{ valor }}">{{ etiqueta }}</option>
                {% endfor %}
            </select><br>

            <label><strong>Descripción:</strong></label><br>
            <textarea name="descripcion" rows="3" required></textarea><br>

            <label><strong>Registrado por:</strong></label><br>
            <input type="text" name="registrado_por" required><br>

            <button type="submit" class="boton">Guardar</button>
            <a href="{% url 'lista_reportes' %}" class="boton-gris">Cancelar</a>
        </form>
    </div>

</body>
</html>
